schema_version = 1
name = "muse-glimmer-30b-unified"
description = "Pinned Muse Glimmer 30B MainTrainer, GraphTrainer, and AutoParallel scaling"
workload = "muse_glimmer_30b_sdpa"

[model]
flavor = "30B"
attention_backend = "packed_document_cudnn_sdpa"

[data]
mode = "streaming"
identity = "batch_hash_manifest"
dataset = "allenai/c4"
revision = "1588ec454efa1a09f29cd18ddd04fe05fc8653a2"
identity_manifest = "{asset:muse_input_manifests}/c4_input_manifest.jsonl"
preflight_auditor = "workloads.muse_glimmer.input_preflight"

[training]
local_batch_size = 2
global_batch_size = -1
seq_len = 4096

[comm]
init_timeout_seconds = 1800

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 8
tensor_parallel_degree = 2
context_parallel_degree = 1
pipeline_parallel_degree = 1

[metrics]
save_for_all_ranks = true

[comparison]
declared_variable = "trainer_parallelization_compile_stack"
allowed_config_paths = ["compile.*", "model_spec.name"]
require_parameter_state = false
pairs = [
  ["tt_main", "gt_manual"],
  ["tt_main", "apgt"],
  ["gt_manual", "apgt"],
]

[mast]
nodes = 2
nproc_per_node = 8
hardware = "grandteton_80g_roce"
locality = "dc;pci1"
gpu_name_contains = "H100"
retries = 0
master_port = 29500
phase_timeout_seconds = 7200

[mast.environment]
HF_HUB_CACHE = "{asset:c4_hf_cache}"
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
HF_HUB_DISABLE_XET = "1"
PYTORCH_ALLOC_CONF = "expandable_segments:True"
TORCHINDUCTOR_CUDAGRAPHS = "0"

[artifacts]
required_assets = ["muse_glimmer", "muse_input_manifests", "c4_hf_cache"]
warmup_steps = 5

[[arms]]
name = "tt_main"
profile = "tt_main_default_v1"
module = "workloads.muse_glimmer.perf_configs"
config = "muse_glimmer_30b_sdpa_c4_torchtitan_4x2"
args = ["--hf-assets-path", "{asset:muse_glimmer}"]
[arms.overrides]
"compile.enable" = true
"compile.backend" = "inductor"
"compile.components" = ["model", "loss"]

[[arms]]
name = "gt_manual"
profile = "gt_manual_eager_v1"
module = "workloads.muse_glimmer.perf_configs"
config = "graph_trainer_muse_glimmer_30b_sdpa_c4_4x2"
args = ["--hf-assets-path", "{asset:muse_glimmer}"]
[arms.overrides]
"compile.enable_autoparallel" = false

[[arms]]
name = "apgt"
profile = "apgt_validated_v1"
module = "workloads.muse_glimmer.perf_configs"
config = "graph_trainer_muse_glimmer_30b_sdpa_c4_autoparallel_4x2"
args = ["--hf-assets-path", "{asset:muse_glimmer}"]
[arms.overrides]
"compile.enable_autoparallel" = true
"compile.autoparallel_solver" = "approx"

[[phases]]
name = "performance"
kind = "performance"
arms = ["tt_main", "gt_manual", "apgt"]
[phases.overrides]
"training.steps" = 25
"profiler.enable_profiling" = false
"profiler.enable_memory_snapshot" = false
"metrics.log_freq" = 5

[[phases]]
name = "trace"
kind = "trace"
arms = ["tt_main", "gt_manual", "apgt"]
trace_ranks = [0]
[phases.overrides]
"training.steps" = 6
"profiler.enable_profiling" = true
"profiler.enable_memory_snapshot" = false
"profiler.profile_freq" = 6
"profiler.profiler_warmup" = 0
"profiler.profiler_active" = 3
"profiler.profiler_repeat" = 1
"metrics.log_freq" = 1

[[matrix.points]]
name = "16gpu"
[matrix.points.settings]
"mast.nodes" = 2
"parallelism.data_parallel_shard_degree" = 8
"data.identity_manifest" = "{asset:muse_input_manifests}/c4_input_manifest_lb2_s4096_dp8.jsonl"
"data.identity_manifest_sha256" = "4fda638c406cb949694e6007b404f026b1c37a33b94511aefdf2e78b14520f71"

[[matrix.points]]
name = "1d-fsdp8"
[matrix.points.settings]
"mast.nodes" = 1
"parallelism.data_parallel_shard_degree" = 8
"parallelism.tensor_parallel_degree" = 1
