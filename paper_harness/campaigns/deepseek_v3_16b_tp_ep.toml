schema_version = 1
name = "deepseek-v3-16b-tp-ep"
description = "DeepSeek V3 16B MainTrainer, GraphTrainer, and AutoParallel TP and folded-EP matrix"
workload = "deepseek_v3_16b"

[model]
flavor = "16B"
attention_backend = "sdpa"

[data]
mode = "streaming"
identity = "index_manifest"
dataset = "allenai/c4"
revision = "1588ec454efa1a09f29cd18ddd04fe05fc8653a2"
identity_manifest = "{harness}/data/index_manifests/deepseek_v3_16b_tp_ep.json"
identity_manifest_sha256 = "79a9d5cacbdfadb9df416f4157690f491c752a785ec282d1adcbdac031afeaaf"

[training]
local_batch_size = 2
global_batch_size = 2
seq_len = 4096

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 1
tensor_parallel_degree = 8
enable_sequence_parallel = true
context_parallel_degree = 1
pipeline_parallel_degree = 1
expert_parallel_degree = 8

[metrics]
save_for_all_ranks = true

[comparison]
declared_variable = "trainer_parallelization_compile_stack"
allowed_config_paths = ["compile.*", "model_spec.name"]
allowed_environment_keys = ["BENCHMARK_CONFIGURATION", "EXPERIMENT_ARM"]
pairs = [
  ["tt_main", "gt_manual"],
  ["tt_main", "apgt"],
  ["gt_manual", "apgt"],
]

[mast]
nodes = 1
nproc_per_node = 8
hardware = "grandteton_80g_roce"
locality = "dc;pci1"
gpu_name_contains = "H100"
retries = 0
master_port = 29500
phase_timeout_seconds = 7200

[mast.environment]
BENCHMARK_WORLD_SIZE = "8"
BENCHMARK_DP_DEGREE = "1"
BENCHMARK_EP_DEGREE = "8"
BENCHMARK_TP_DEGREE = "8"
BENCHMARK_LOCAL_BATCH_SIZE = "2"
BENCHMARK_GLOBAL_BATCH_SIZE = "2"
C4_SHARD_ROOT = "{asset:offline_c4}"
DEEPSEEK_TOKENIZER_DIR = "{asset:deepseek_tokenizer}"
FIXED_REPLAY_BATCHES = "10"
AP_COLLECTIVE_MUST_SAVE_EXPECTATION = "off"
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
PYTORCH_ALLOC_CONF = "expandable_segments:True"
TORCHINDUCTOR_CUDAGRAPHS = "0"

[artifacts]
required_assets = ["offline_c4", "deepseek_tokenizer"]
warmup_steps = 5

[[arms]]
name = "tt_main"
profile = "tt_main_default_v1"
module = "workloads.deepseek_v3.perf_configs"
config = "torchtitan_baseline_16b"
[arms.environment]
BENCHMARK_CONFIGURATION = "torchtitan_baseline"
EXPERIMENT_ARM = "T"

[[arms]]
name = "gt_manual"
profile = "gt_manual_eager_v1"
module = "workloads.deepseek_v3.perf_configs"
config = "graphtrainer_manual_16b"
[arms.environment]
BENCHMARK_CONFIGURATION = "graphtrainer_manual"
EXPERIMENT_ARM = "M"

[[arms]]
name = "apgt"
profile = "apgt_validated_v1"
module = "workloads.deepseek_v3.perf_configs"
config = "autoparallel_graphtrainer_16b"
[arms.overrides]
"compile.autoparallel_solver" = "approx"
[arms.environment]
BENCHMARK_CONFIGURATION = "autoparallel_graphtrainer"
EXPERIMENT_ARM = "G"

[[phases]]
name = "performance"
kind = "performance"
arms = ["tt_main", "gt_manual", "apgt"]
[phases.overrides]
"training.steps" = 25
"profiler.enable_profiling" = false
"profiler.enable_memory_snapshot" = false
"metrics.log_freq" = 5

[[phases]]
name = "trace"
kind = "trace"
arms = ["tt_main", "gt_manual", "apgt"]
trace_ranks = [0]
[phases.overrides]
"training.steps" = 6
"profiler.enable_profiling" = true
"profiler.enable_memory_snapshot" = false
"profiler.profile_freq" = 6
"profiler.profiler_warmup" = 0
"profiler.profiler_active" = 3
"profiler.profiler_repeat" = 1
"metrics.log_freq" = 1

[[matrix.points]]
name = "1d-tp8-ep8-sp"
[matrix.points.settings]
"mast.nodes" = 1
"parallelism.data_parallel_shard_degree" = 1
"parallelism.tensor_parallel_degree" = 8
"parallelism.expert_parallel_degree" = 8
"training.global_batch_size" = 2
"mast.environment.BENCHMARK_WORLD_SIZE" = "8"
"mast.environment.BENCHMARK_DP_DEGREE" = "1"
"mast.environment.BENCHMARK_EP_DEGREE" = "8"
"mast.environment.BENCHMARK_GLOBAL_BATCH_SIZE" = "2"

[[matrix.points]]
name = "2d-dps2-tp8-ep8-sp"
[matrix.points.settings]
"mast.nodes" = 2
"parallelism.data_parallel_shard_degree" = 2
"parallelism.tensor_parallel_degree" = 8
"parallelism.expert_parallel_degree" = 8
"training.global_batch_size" = 4
"mast.environment.BENCHMARK_WORLD_SIZE" = "16"
"mast.environment.BENCHMARK_DP_DEGREE" = "2"
"mast.environment.BENCHMARK_EP_DEGREE" = "8"
"mast.environment.BENCHMARK_GLOBAL_BATCH_SIZE" = "4"

[[matrix.points]]
name = "3d-dps4-tp8-ep16-sp"
[matrix.points.settings]
"mast.nodes" = 4
"parallelism.data_parallel_shard_degree" = 4
"parallelism.tensor_parallel_degree" = 8
"parallelism.expert_parallel_degree" = 16
"training.global_batch_size" = 8
"mast.environment.BENCHMARK_WORLD_SIZE" = "32"
"mast.environment.BENCHMARK_DP_DEGREE" = "4"
"mast.environment.BENCHMARK_EP_DEGREE" = "16"
"mast.environment.BENCHMARK_GLOBAL_BATCH_SIZE" = "8"
