schema_version = 1
name = "qwen3-30b-a3b-2d-dps16-tp4-ep4"
description = "Qwen3 30B-A3B MoE MainTrainer and AutoParallel GraphTrainer on DPS16 x TP4 with EP4 over TP (2D mesh; random init, C4 replay with the LLaMA 3 tokenizer)"
workload = "qwen3_30b_a3b_2d"

[model]
flavor = "30B-A3B"
attention_backend = "sdpa"

[data]
mode = "replay"
identity = "manifest"
dataset = "allenai/c4"
revision = "1588ec454efa1a09f29cd18ddd04fe05fc8653a2"
identity_manifest = "{asset:llama_replay}/manifest.json"
identity_manifest_sha256 = "2f17a4bdf5328e6b9949d5c78ee66fb59393fba7f1c7d55cc827cc5923237020"
preflight_auditor = "workloads.llama3_2d.input_preflight"

[training]
local_batch_size = 2
global_batch_size = 32
gradient_accumulation_steps = 1
seq_len = 8192

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 16
tensor_parallel_degree = 4
context_parallel_degree = 1
pipeline_parallel_degree = 1
expert_parallel_degree = 4

[comparison]
declared_variable = "training_parallelization_compile_stack"
allowed_config_paths = ["compile.*", "model_spec.name"]
allowed_environment_keys = ["BENCHMARK_CONFIGURATION", "EXPERIMENT_ARM", "BENCHMARK_TP_DEGREE"]
pairs = [["tt_main_tp", "apgt"]]

[mast]
nodes = 8
nproc_per_node = 8
hardware = "grandteton_80g_roce"
locality = "dc;pci1"
gpu_name_contains = "H100"
retries = 0
master_port = 29500
phase_timeout_seconds = 21600

[mast.environment]
AUTOPARALLEL_NCCL_COST_MODEL_PROFILE = "h100_nvswitch_roce_400g"
BENCHMARK_MODEL = "30B-A3B"
BENCHMARK_WORLD_SIZE = "64"
BENCHMARK_TP_DEGREE = "4"
BENCHMARK_EP_DEGREE = "4"
BENCHMARK_GLOBAL_BATCH_SIZE = "32"
LLAMA_TOKENIZER_DIR = "{asset:llama_tokenizer}"
REPLAY_TENSORS_PATH = "{asset:llama_replay}/replay_tokens.pt"
REPLAY_MANIFEST_PATH = "{asset:llama_replay}/manifest.json"
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
HF_HUB_DISABLE_XET = "1"
PYTORCH_ALLOC_CONF = "expandable_segments:True"
TORCHINDUCTOR_CUDAGRAPHS = "0"

[artifacts]
required_assets = ["llama_tokenizer", "llama_replay"]
warmup_steps = 5

[[arms]]
name = "tt_main_tp"
profile = "tt_main_default_v1"
module = "workloads.llama3_2d.perf_configs"
config = "torchtitan_baseline_qwen3_30b_a3b"
[arms.environment]
BENCHMARK_CONFIGURATION = "torchtitan_baseline"
EXPERIMENT_ARM = "T"
AP_COLLECTIVE_MUST_SAVE_EXPECTATION = "off"

[[arms]]
name = "apgt"
profile = "apgt_validated_v1"
module = "workloads.llama3_2d.perf_configs"
config = "autoparallel_graphtrainer_qwen3_30b_a3b"
[arms.overrides]
"compile.autoparallel_solver" = "approx"
[arms.environment]
BENCHMARK_CONFIGURATION = "autoparallel_graphtrainer"
EXPERIMENT_ARM = "G"
AP_COLLECTIVE_MUST_SAVE_EXPECTATION = "off"

[[phases]]
name = "performance"
kind = "performance"
arms = ["tt_main_tp", "apgt"]
[phases.overrides]
"comm.init_timeout_seconds" = 14400
"training.steps" = 25
"profiler.enable_profiling" = false
"profiler.enable_memory_snapshot" = false
"metrics.log_freq" = 5

[[phases]]
name = "trace"
kind = "trace"
arms = ["tt_main_tp", "apgt"]
trace_ranks = [0]
[phases.overrides]
"comm.init_timeout_seconds" = 14400
"training.steps" = 6
"profiler.enable_profiling" = true
"profiler.enable_memory_snapshot" = false
"profiler.profile_freq" = 6
"profiler.profiler_warmup" = 0
"profiler.profiler_active" = 3
"profiler.profiler_repeat" = 1
"metrics.log_freq" = 1
