name: Test CUDA

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

concurrency:
  group: test-cuda-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

jobs:
  test-cuda-single-gpu:
    name: Test CUDA Single GPU (cuda13.0-py3.12)
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    with:
      timeout: 60
      runner: mt-l-x86aavx2-11-41-a10g
      gpu-arch-type: cuda
      gpu-arch-version: "13.0"
      submodules: recursive
      script: |
        conda create --yes --quiet --name py312 python=3.12
        source $(conda info --base)/etc/profile.d/conda.sh
        conda activate py312

        pip install --quiet -r requirements-test.txt
        # For some reason the spec above isnt working
        pip uninstall -y torch
        pip install --no-input --quiet --pre torch --index-url https://download.pytorch.org/whl/nightly/cu130
        pip install --quiet .
        pytest tests

  examples-cuda-single-gpu:
    name: Examples CUDA Single GPU (cuda13.0-py3.12)
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    with:
      timeout: 60
      runner: mt-l-x86aavx2-11-41-a10g
      gpu-arch-type: cuda
      gpu-arch-version: "13.0"
      submodules: recursive
      script: |
        conda create --yes --quiet --name py312 python=3.12
        source $(conda info --base)/etc/profile.d/conda.sh
        conda activate py312

        pip install --quiet -r requirements-test.txt
        # For some reason the spec above isnt working
        pip uninstall -y torch
        pip install --no-input --quiet --pre torch --index-url https://download.pytorch.org/whl/nightly/cu130
        pip install --quiet .
        run_timed() { local start=$SECONDS; "$@"; echo "$* : $((SECONDS - start))s" >> /tmp/timings.txt; }
        run_timed python examples/example_autoparallel.py
        run_timed env AUTOPARALLEL_VERBOSE=1 python examples/example_llama3.py
        run_timed python examples/example_local_map.py
        echo "========== Timings =========="
        cat /tmp/timings.txt

  test-cuda-multi-gpu:
    name: Test CUDA Multi GPU (cuda13.0-py3.12)
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    with:
      timeout: 60
      runner: mt-l-x86aavx2-45-167-a10g-4
      gpu-arch-type: cuda
      gpu-arch-version: "13.0"
      submodules: recursive
      script: |
        echo "127.0.0.1 ${HOSTNAME}" >> /etc/hosts

        conda create --yes --quiet --name py312 python=3.12
        source $(conda info --base)/etc/profile.d/conda.sh
        conda activate py312

        pip install --quiet -r requirements-test.txt
        # For some reason the spec above isnt working
        pip uninstall -y torch
        pip install --no-input --quiet --pre torch --index-url https://download.pytorch.org/whl/nightly/cu130
        pip install --quiet .
        python -m pytest tests/test_dcp_roundtrip.py -v
        torchrun --standalone --nproc-per-node 4 examples/example_ds3_local_map.py
        PYTHONPATH=. torchrun --standalone --nproc-per-node 4 tests/test_ds3_local_map_numerics.py --case legacy_2d --dtype bfloat16
