name: Test TorchTitan Integration

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

concurrency:
  group: test-torchtitan-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

jobs:
  test-torchtitan:
    name: Test TorchTitan Integration (cuda13.0-py3.12)
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: 12xlargegpu
            runs-on: linux.g5.12xlarge.nvidia.gpu
            torch-spec: '--pre torch --index-url https://download.pytorch.org/whl/nightly/cu130'
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
    with:
      timeout: 60
      runner: ${{ matrix.runs-on }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      submodules: recursive
      script: |
        conda create --yes --quiet --name py312 python=3.12
        source $(conda info --base)/etc/profile.d/conda.sh
        conda activate py312

        # Install the CUDA 13 nightly before resolving project dependencies.
        # TorchTitan requires CUDA 13 bindings; cu126 introduces CUDA 12
        # NVSHMEM wheels that overlap the CUDA 13 package's shared libraries.
        pip install --no-input --quiet --pre torch --index-url https://download.pytorch.org/whl/nightly/cu130
        pip install --quiet -r requirements-test.txt
        pip install --quiet .

        # Clone TorchTitan
        git clone https://github.com/pytorch/torchtitan.git
        cd torchtitan
        pip install --quiet -r requirements.txt
        pip check
        python -c "import torch; print(torch.__version__, torch.version.cuda)"

        # Run TorchTitan training with AutoParallel
        export MODULE=autoparallel._testing.torchtitan
        export CONFIG=autoparallel_llama3_debugmodel
        python -m torchtitan.train --module "$MODULE" --config "$CONFIG" --print-config
        NGPU=4 ./run_train.sh

        # TODO: Re-enable deepseek_v3 test once torchtitan experiment is fixed
        # (deepseek_v3 experiment is also disabled in torchtitan's own CI)
        # NGPU=4 ./run_train.sh \
        #   --module autoparallel.deepseek_v3 \
        #   --config autoparallel_deepseek_v3_debugmodel \
        #   --parallelism.data_parallel_shard_degree 4 \
        #   --parallelism.expert_parallel_degree 4
